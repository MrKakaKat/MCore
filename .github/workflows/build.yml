name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # a manual run can publish a release too (it creates the tag).
  workflow_dispatch:
    inputs:
      release:
        description: 'Release tag to publish, e.g. v0.1.0 (empty: just build)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.release || github.ref_name }}
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || (inputs.release || '') != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # pinned: 3.50 wants Gradle 9.3 / a newer AGP than the project's.
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Dependencies
        run: |
          flutter pub get
          (cd packages/movement_core && dart pub get)

      # deprecation notes from newer Flutter releases do not fail the build.
      - name: Checks
        run: |
          flutter analyze --no-fatal-infos
          flutter test
          (cd packages/movement_core && dart analyze && dart test)

      - name: Build APK
        if: github.event_name != 'pull_request'
        run: |
          # build numbers only grow, past the early test builds (up to 99).
          flutter build apk --release --target-platform android-arm64 \
            --split-debug-info=build/symbols --build-number=$(( ${{ github.run_number }} + 100 ))
          cp build/app/outputs/flutter-apk/app-release.apk "MCore-${VERSION//\//-}.apk"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && env.RELEASE != 'true'
        with:
          name: MCore-apk
          path: MCore-*.apk
          retention-days: 7

      - name: Release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: MCore ${{ env.VERSION }}
          files: MCore-*.apk
          fail_on_unmatched_files: true
