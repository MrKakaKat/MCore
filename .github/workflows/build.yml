name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Dependencies
        run: |
          flutter pub get
          (cd packages/movement_core && dart pub get)

      # deprecation notes from newer Flutter releases do not fail the build.
      - name: Checks
        run: |
          flutter analyze --no-fatal-infos
          flutter test
          (cd packages/movement_core && dart analyze --no-fatal-infos && dart test)

      - name: Build APK
        if: github.event_name != 'pull_request'
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --split-debug-info=build/symbols --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk "MCore-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        with:
          name: MCore-apk
          path: MCore-*.apk
          retention-days: 7

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MCore ${{ github.ref_name }}
          files: MCore-*.apk
          fail_on_unmatched_files: true
