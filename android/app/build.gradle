plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "slop.nut"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "slop.nut"
        // 24: what the media code (MediaCodec input images, Opus, frame
        // batches checked at run time) is written against.
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // One fixed key for every build, so an update installs over the app
    // already there and keeps its projects. The key is public, in the
    // repository (android/app/mcore-sideload.jks): it only ties updates
    // together, it does not prove where an APK came from - install MCore
    // from this repository's Releases only (see README.md). The variables
    // below can point a build at another key instead.
    def keystorePath = System.getenv("MCORE_KEYSTORE") ?: "mcore-sideload.jks"
    def hasKey = file(keystorePath).exists()
    def storePass = System.getenv("MCORE_KEYSTORE_PASSWORD") ?: "mcore-sideload"
    signingConfigs {
        if (hasKey) {
            release {
                storeFile = file(keystorePath)
                storePassword = storePass
                keyAlias = System.getenv("MCORE_KEY_ALIAS") ?: "mcore"
                keyPassword = System.getenv("MCORE_KEY_PASSWORD") ?: storePass
            }
        }
    }

    buildTypes {
        release {
            signingConfig = hasKey ? signingConfigs.release : signingConfigs.debug
            // phones of today only (64-bit ARM).
            ndk {
                abiFilters "arm64-v8a"
            }
        }
    }
}

flutter {
    source = "../.."
}
