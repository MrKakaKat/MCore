name: movement_mobile
description: >
  MCore: a mobile animation editor. The engine lives in
  packages/movement_core (pure Dart, tested with dart test); this package
  is the Flutter app (render/, ui/, services/, io/) on top of it.
publish_to: none
version: 0.1.4+9

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  movement_core:
    path: packages/movement_core
  # picking images, videos, sounds, fonts and projects from the device
  file_picker: ^8.1.2
  # the app's own data folder (projects, autosave, media)
  path_provider: ^2.1.3
  # sound playback; its position is the clock playback follows
  just_audio: ^0.9.46
  # project bundles and backups
  archive: ^4.5.2
  # (video and sound go through Android's own codecs, see
  # android/app/src/main/kotlin/.../MediaPlugin.kt - nothing bundled)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # tests fake the app data folder
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Roboto-Regular.ttf
  shaders:
    - shaders/filter.frag
